# ==============================================================================
# الملف: pubspec.yaml
# الوظيفة: تعريف اسم المشروع، رقم الإصدار (1.1.0)، المكتبات المعتمدة،
#          مسارات الأصول، وإعدادات توليد أيقونة التطبيق تلقائياً.
# ==============================================================================

name: athar_muslim
description: "تطبيق أثر مسلم - القرآن الكريم، مواقيت الصلاة والأذان، والمسبحة الإلكترونية."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- إدارة الحالة البسيطة ---
  provider: ^6.1.2

  # --- واجهة القرآن الكريم الأساسية ---
  flutter_quran: ^0.1.3

  # --- الصوت والتلاوات والأذان ---
  just_audio: ^0.9.44
  audio_session: ^0.1.31

  # --- حساب مواقيت الصلاة وجدولة الأذان في الخلفية ---
  awqat: ^0.0.4
  android_alarm_manager_plus: ^4.0.5
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # --- تحديد الموقع الجغرافي ---
  geolocator: ^13.0.1

  # --- شريط الصور الدوارة في الشاشة الرئيسية ---
  carousel_slider: ^5.0.0

  # --- التخزين المحلي البسيط والحفاظ على البيانات ---
  shared_preferences: ^2.3.3

  # --- مشاركة الآيات ونسخها ---
  share_plus: ^10.1.1

  # --- الأيقونات ---
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # --- أداة توليد أيقونات التطبيق لجميع الكثافات تلقائياً ---
  flutter_launcher_icons: ^0.13.1

# ==============================================================================
# إعدادات توليد أيقونة التطبيق (flutter_launcher_icons)
# لتوليد الأيقونات بعد وضع صورتك في assets/icon/app_icon.png، نفذ:
# flutter pub run flutter_launcher_icons
# ==============================================================================
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#E1F5FE"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
    - assets/icon/
